<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/caracteristicas.css">
    <title>Jogo da Velha - Características</title>
</head>

<body>

    <div class="nome">
        <h2>Nome</h2>
        <input type="text" id="nome" maxlength="15" placeholder="Digite seu nome">
    </div>

    <div class="personagem">
        <h2>Personagem</h2>

        <div class="personagem1">
            <img src="../img/image1.png" alt="Personagem 1">
        </div>

        <div class="personagem2">
            <img src="../img/image2.png" alt="Personagem 2">
        </div>

        <div class="personagem3">
            <img src="../img/image3.png" alt="Personagem 3">
        </div>

        <div class="personagem4">
            <img src="../img/image4.png" alt="Personagem 4">
        </div>

        <div class="personagem5">
            <img src="../img/image5.png" alt="Personagem 5">
        </div>

        <div class="personagem6">
            <img src="../img/image6.png" alt="Personagem 6">
        </div>

    </div>

    <div class="simbolo">
        <h2>Símbolo</h2>
        <div class="simbolo">X</div>
        <div class="simbolo">O</div>
    </div>

    <div class="cor">
        <h2>Cor</h2>
        <div class="cor vermelho"></div>
        <div class="cor rosa"></div>
        <div class="cor roxo"></div>
        <div class="cor azul"></div>
        <div class="cor verde"></div>
        <div class="cor amarelo"></div>
    </div>

    <div class="modo">
        <h2>Modo</h2>
        <div class="opcoes">
            <div class="modo">Aleatório</div>
            <div class="modo">Computador</div>
            <div class="modo">Amigo</div>
        </div>
        <input type="text" id="nome-amigo" class="nome-amigo" maxlength="15" placeholder="Digite o nome do amigo">
    </div>

    <a href="tabuleiro.html" class="botao" id="jogar">Jogar</a>

    <script src="../js/sons.js"></script>
    <script src="../js/caracteristicas.js"></script>
</body>

</html>
